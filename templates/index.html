<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy | AI Fitness Plan</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>

<body>
    <main class="container">
        <div class="hero">
            <span class="badge">AI FITNESS COACH</span>
            <h1>FitBuddy</h1>
            <p>Build a personalized 7-day workout and wellness plan in under a minute.</p>
        </div>

        <section class="card">
            <form method="post" action="/generate-workout">
                <div class="form-grid">
                    <label>
                        Name
                        <input type="text" name="username" placeholder="e.g. Alex" required>
                    </label>

                    <label>
                        User ID
                        <input type="text" name="user_id" placeholder="e.g. alex_01" required>
                    </label>

                    <label>
                        Age
                        <input type="number" name="age" min="13" max="100" required>
                    </label>

                    <label>
                        Weight (kg)
                        <input type="number" name="weight" min="1" max="500" step="0.1" required>
                    </label>

                    <label>
                        Goal
                        <select name="goal" required>
                            <option value="">Select a goal</option>
                            <option value="weight loss">Weight loss</option>
                            <option value="muscle gain">Muscle gain</option>
                            <option value="general wellness">General wellness</option>
                            <option value="flexibility">Flexibility</option>
                        </select>
                    </label>

                    <label>
                        Intensity
                        <select name="intensity" required>
                            <option value="">Select intensity</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </label>
                </div>

                <div style="margin-top: 24px;">
                    <button type="submit">Generate my plan</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
